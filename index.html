<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#10171e" />
    <meta
      name="description"
      content="Explore five original landscapes and interactive particle installations in a browser-based XR world gallery."
    />
    <title>My 3D World · Zyberlane XR</title>
  </head>
  <body>
    <canvas
      id="view"
      tabindex="0"
      aria-label="Interactive 3D world. Drag to look and use WASD to walk."
    ></canvas>
    <header>
      <button id="home" class="brand" aria-label="Return to observatory">
        <svg
          viewBox="0 0 40 40"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
        >
          <circle cx="20" cy="20" r="15" />
          <ellipse
            cx="20"
            cy="20"
            rx="7"
            ry="15"
            transform="rotate(35 20 20)"
          />
          <path d="M3 24Q19 12 37 16" /></svg
        ><span>My 3D World</span></button
      ><span class="maker">ZYBERLANE XR</span>
      <div class="head-actions">
        <button id="index-open">World index</button
        ><button id="settings-open">View options</button>
      </div>
    </header>
    <main id="scene-info">
      <div class="eyebrow"><i></i><span id="kind"></span></div>
      <h1 id="title">The Observatory</h1>
      <p id="summary"></p>
      <div id="actions"></div>
    </main>
    <div id="hand-view"></div>
    <div id="joystick" aria-label="Movement joystick"><i></i></div>
    <footer>
      <span id="location"></span>
      <div>
        <button id="help-open">Controls</button
        ><button id="clear">Hide interface</button>
      </div>
    </footer>
    <button id="restore" hidden>Show interface</button
    ><button id="stereo-exit">Exit stereo</button>
    <dialog id="panel">
      <div class="dialog-top">
        <h2 id="panel-title"></h2>
        <button id="close" aria-label="Close menu">×</button>
      </div>
      <div id="panel-body"></div>
    </dialog>
    <p id="status" role="status"></p>
    <div id="loading" role="status">Opening the observatory…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
