<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#14121c" />
    <meta
      name="description"
      content="Step through five gates into a browser-based gallery of landscapes and interactive particle art."
    />
    <title>My 3D World · Zyberlane XR</title>
  </head>
  <body>
    <canvas
      id="scene"
      aria-label="Interactive world. Drag to look and use WASD to walk."
    ></canvas>
    <header>
      <div class="brand">
        <i aria-hidden="true">✧</i><span>ZYBERLANE <b>XR</b></span>
      </div>
      <button id="settings">View controls</button>
    </header>
    <div id="loading" role="status">Opening the observatory…</div>
    <main>
      <p class="context" id="kind"></p>
      <h1 id="name"></h1>
      <p id="note"></p>
      <div id="tools"></div>
      <div class="actions">
        <button class="primary" id="index">World index ↗</button
        ><button id="home">Return to hub</button>
      </div>
    </main>
    <div id="joystick" aria-label="Touch movement joystick"><i></i></div>
    <aside id="camera" hidden>
      <video playsinline muted></video><canvas></canvas>
    </aside>
    <div id="status" role="status" aria-live="polite"></div>
    <button id="leave" hidden>Exit stereo</button>
    <dialog id="menu">
      <div class="heading">
        <h2></h2>
        <button id="close" aria-label="Close menu">×</button>
      </div>
      <div id="list"></div>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
